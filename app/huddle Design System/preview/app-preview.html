<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css">
<style>
  .phone { width: 240px; height: 340px; background: #fff; border-radius: 36px; border: 2px solid var(--fg-1); box-shadow: 0 18px 40px rgba(33,69,207,0.22); position: relative; overflow: hidden; padding: 14px 16px; }
  .phone-notch { width: 70px; height: 18px; background: var(--fg-1); border-radius: 0 0 12px 12px; margin: -14px auto 10px auto; }
  .phone-header { display: flex; justify-content: center; margin-bottom: 14px; }
  .phone-header img { height: 24px; width: auto; }
  .phone-title { font-size: 18px; font-weight: 700; color: var(--fg-1); margin-bottom: 10px; }
  .phone-row { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; background: #F3F4F6; box-shadow: inset 2px 2px 5px rgba(163,168,190,0.15), inset -2px -2px 5px rgba(255,255,255,0.9); margin-bottom: 8px; }
  .phone-av { width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, #FF7F50, #CFAB21); }
  .phone-row-meta div:first-child { font-size: 13px; font-weight: 600; color: var(--fg-1); }
  .phone-row-meta div:last-child { font-size: 11px; color: var(--fg-2); }
</style></head>
<body><div class="card" style="background: linear-gradient(135deg, #EBF5FF 0%, #F3F4F6 100%); display: flex; align-items: center; justify-content: center; min-height: 360px;">
  <div class="phone">
    <div class="phone-notch"></div>
    <div class="phone-header"><img src="../assets/huddle-wordmark.png" alt="huddle"/></div>
    <div class="phone-title">Nearby</div>
    <div class="phone-row">
      <div class="phone-av"></div>
      <div class="phone-row-meta" style="flex:1"><div>Buddy</div><div>Dog · Labrador · 4y</div></div>
      <div style="font-size:10px; font-weight:600; color:#2145CF">200m</div>
    </div>
    <div class="phone-row">
      <div class="phone-av" style="background: linear-gradient(135deg, #2145CF, #3A5FE8);"></div>
      <div class="phone-row-meta" style="flex:1"><div>Luna</div><div>Cat · Calico · 2y</div></div>
      <div style="font-size:10px; font-weight:600; color:#2145CF">480m</div>
    </div>
    <div class="phone-row">
      <div class="phone-av" style="background: linear-gradient(135deg, #BFFF00, #22C55E);"></div>
      <div class="phone-row-meta" style="flex:1"><div>Marcus</div><div>Animal Friend</div></div>
      <div style="font-size:10px; font-weight:600; color:#2145CF">700m</div>
    </div>
  </div>
</div></body></html>
