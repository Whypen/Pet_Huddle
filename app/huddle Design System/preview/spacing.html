<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css"></head>
<body><div class="card">
  <div class="grid" style="grid-template-columns: repeat(9, 1fr); align-items: end;">
    <div class="col" style="gap:4px"><div style="height:4px; width:100%; background:var(--fg-1); border-radius:2px;"></div><span class="mono" style="color:var(--fg-2)">4</span><span class="label-eyebrow">1</span></div>
    <div class="col" style="gap:4px"><div style="height:8px; width:100%; background:var(--fg-1); border-radius:2px;"></div><span class="mono" style="color:var(--fg-2)">8</span><span class="label-eyebrow">2</span></div>
    <div class="col" style="gap:4px"><div style="height:12px; width:100%; background:var(--fg-1); border-radius:2px;"></div><span class="mono" style="color:var(--fg-2)">12</span><span class="label-eyebrow">3</span></div>
    <div class="col" style="gap:4px"><div style="height:16px; width:100%; background:var(--fg-1); border-radius:2px;"></div><span class="mono" style="color:var(--fg-2)">16</span><span class="label-eyebrow">4</span></div>
    <div class="col" style="gap:4px"><div style="height:24px; width:100%; background:var(--fg-1); border-radius:2px;"></div><span class="mono" style="color:var(--fg-2)">24</span><span class="label-eyebrow">5</span></div>
    <div class="col" style="gap:4px"><div style="height:32px; width:100%; background:var(--fg-1); border-radius:2px;"></div><span class="mono" style="color:var(--fg-2)">32</span><span class="label-eyebrow">6</span></div>
    <div class="col" style="gap:4px"><div style="height:40px; width:100%; background:var(--fg-1); border-radius:2px;"></div><span class="mono" style="color:var(--fg-2)">40</span><span class="label-eyebrow">7</span></div>
    <div class="col" style="gap:4px"><div style="height:48px; width:100%; background:var(--fg-1); border-radius:2px;"></div><span class="mono" style="color:var(--fg-2)">48</span><span class="label-eyebrow">8</span></div>
    <div class="col" style="gap:4px"><div style="height:64px; width:100%; background:var(--fg-1); border-radius:2px;"></div><span class="mono" style="color:var(--fg-2)">64</span><span class="label-eyebrow">9</span></div>
  </div>
  <div style="margin-top:14px" class="label-eyebrow">8pt grid · space-1 through space-9</div>
</div></body></html>
