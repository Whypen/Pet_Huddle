<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css">
<style>
  .btn { border: none; font-family: var(--font-sans); font-size: 15px; font-weight: 600; height: 48px; padding: 0 22px; border-radius: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; letter-spacing: -0.005em; }
  .btn-primary { background: #2145CF; color: #fff; box-shadow: 0 6px 18px rgba(33,69,207,0.28), 0 2px 4px rgba(33,69,207,0.16), inset 0 1px 0 rgba(255,255,255,0.25); }
  .btn-neu { background: #F3F4F6; color: var(--fg-1); box-shadow: 5px 5px 14px rgba(163,168,190,0.28), -4px -4px 10px rgba(255,255,255,0.84), inset 0 1px 0 rgba(255,255,255,0.9); }
  .btn-ghost { background: transparent; color: #2145CF; border: 1.5px solid rgba(33,69,207,0.35); }
  .btn-gold { background: #CFAB21; color: #2A2400; box-shadow: 0 6px 18px rgba(207,171,33,0.3), inset 0 1px 0 rgba(255,255,255,0.45); }
  .btn-danger { background: #EF4444; color: #fff; box-shadow: 0 6px 16px rgba(239,68,68,0.28); }
</style></head>
<body><div class="card">
  <div class="row" style="gap: 14px;">
    <button class="btn btn-primary">Join the huddle</button>
    <button class="btn btn-neu">Cancel</button>
    <button class="btn btn-ghost">Learn more</button>
    <button class="btn btn-gold">Secure Privileges</button>
    <button class="btn btn-danger">Delete pet</button>
  </div>
  <div class="row" style="margin-top: 14px; gap: 36px;">
    <span class="label-eyebrow">Primary</span>
    <span class="label-eyebrow">Neu · secondary</span>
    <span class="label-eyebrow">Ghost</span>
    <span class="label-eyebrow">Gold · premium</span>
    <span class="label-eyebrow">Destructive</span>
  </div>
</div></body></html>
