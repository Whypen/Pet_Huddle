<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css"></head>
<body><div class="card" style="background:#F3F4F6">
  <div class="grid" style="grid-template-columns: repeat(3, 1fr); gap:20px;">
    <div class="col" style="gap:10px">
      <div style="width:100%; height:90px; border-radius:16px; background:#F3F4F6; box-shadow: 5px 5px 14px rgba(163,168,190,0.28), -4px -4px 10px rgba(255,255,255,0.84), inset 0 1px 0 rgba(255,255,255,0.9);"></div>
      <span class="label-eyebrow">Neu · Rest</span>
      <span class="mono" style="color:var(--fg-2); font-size:10px">5 5 14 / neutral grey drop</span>
    </div>
    <div class="col" style="gap:10px">
      <div style="width:100%; height:90px; border-radius:16px; background:#F3F4F6; box-shadow: inset 3px 3px 9px rgba(163,168,190,0.32), inset -2px -2px 6px rgba(255,255,255,0.82);"></div>
      <span class="label-eyebrow">Neu · Pressed</span>
      <span class="mono" style="color:var(--fg-2); font-size:10px">inset · bevel inverted</span>
    </div>
    <div class="col" style="gap:10px">
      <div style="width:100%; height:90px; border-radius:20px; background: rgba(255,255,255,0.72); border: 1px solid rgba(255,255,255,0.55); box-shadow: 0 8px 24px rgba(0,87,255,0.13), 0 2px 6px rgba(0,87,255,0.07), inset 0 1px 0 rgba(255,255,255,0.78);"></div>
      <span class="label-eyebrow">Glass · L2</span>
      <span class="mono" style="color:var(--fg-2); font-size:10px">blue-tinted drop · E2</span>
    </div>
  </div>
</div></body></html>
